name: "Build LaTeX Journal with Biber"
on:
  push: {branches: [main]}
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wtfjoke/setup-tectonic@v4
        with: {biber-version: "latest"}
      - name: Cache Tectonic
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: ${{ runner.os }}-tectonic-
      - name: Run Tectonic + Biber
        run: tectonic main.tex
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: journal-pdf
          path: main.pdf
